<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ostinascope</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23F2C200'/%3E%3Cpath d='M3 5h10M2 8h12M3 11h10' stroke='%23141414' stroke-width='1.6'/%3E%3C/svg%3E">
  <meta name="description" content="カメラに映った繰り返しパターンを見つけて、ループとして鳴らす。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- not render-blocking: on a slow or offline network the app must still start at once -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="view" aria-label="カメラ映像と検出結果"></canvas>
  <video id="video" playsinline muted autoplay></video>
  <div id="insets" aria-hidden="true"></div>

  <section id="start">
    <div class="plate">
      <p class="fig">fig. 0 — instrument</p>
      <h1>OSTINASCOPE</h1>
      <p class="lead">見えないリズムを、見えている形の中から掘り出す。</p>

      <svg class="specimen" viewBox="0 0 320 120" role="img" aria-label="縞・格子・点・同心円の標本">
        <defs>
          <clipPath id="c1"><circle cx="44" cy="60" r="34"/></clipPath>
          <clipPath id="c2"><rect x="96" y="28" width="64" height="64" transform="rotate(-8 128 60)"/></clipPath>
          <clipPath id="c3"><polygon points="214,24 250,92 178,92"/></clipPath>
          <clipPath id="c4"><circle cx="284" cy="60" r="30"/></clipPath>
          <pattern id="p-stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
            <rect width="6" height="2.7" fill="#141414"/>
          </pattern>
          <pattern id="p-grid" width="6" height="8" patternUnits="userSpaceOnUse">
            <rect width="1.2" height="8" fill="#D7262B"/><rect width="6" height="1.2" fill="#D7262B"/>
          </pattern>
          <pattern id="p-dots" width="6" height="5.2" patternUnits="userSpaceOnUse">
            <circle cx="1.5" cy="1.3" r="1.2" fill="#141414"/><circle cx="4.5" cy="3.9" r="1.2" fill="#141414"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="88" height="120" fill="url(#p-stripe)" clip-path="url(#c1)"/>
        <circle cx="44" cy="60" r="34" fill="none" stroke="#141414" stroke-width="1.5"/>
        <rect x="90" y="20" width="80" height="80" fill="url(#p-grid)" clip-path="url(#c2)"/>
        <rect x="96" y="28" width="64" height="64" fill="none" stroke="#D7262B" stroke-width="1.5" transform="rotate(-8 128 60)"/>
        <polygon points="214,24 250,92 178,92" fill="#F2C200"/>
        <rect x="170" y="20" width="90" height="80" fill="url(#p-dots)" clip-path="url(#c3)"/>
        <g clip-path="url(#c4)" fill="none" stroke="#1F4FD1" stroke-width="2.2">
          <circle cx="284" cy="60" r="4"/><circle cx="284" cy="60" r="10"/><circle cx="284" cy="60" r="16"/>
          <circle cx="284" cy="60" r="22"/><circle cx="284" cy="60" r="28"/>
        </g>
        <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="7.5" fill="#141414">
          <text x="18" y="114">STRIPE→1/8</text><text x="104" y="114">GRID→3:4</text>
          <text x="184" y="114">DOTS→E(5,16)</text><text x="262" y="114">RINGS→drone</text>
        </g>
      </svg>

      <ol class="how">
        <li>カメラをポスターや床・壁・服に向ける</li>
        <li>繰り返し（縞・格子・点・同心円、似たものの並び）が見つかると、ループが鳴り始める</li>
        <li>動かす・近づく・離れる — それがそのままミックスになる</li>
      </ol>

      <button id="btn-camera" class="primary">タップして開始</button>
      <button id="btn-demo" class="secondary">デモポスターで試す（カメラなし）</button>
      <p id="start-error" role="alert"></p>
      <p class="note">イヤホン推奨。カメラ映像は端末の中だけで解析され、どこにも送信されません。</p>
      <p class="version"><span class="version-text">版：…</span> <button class="link refresh-app" type="button">最新版に更新</button></p>
    </div>
  </section>

  <button id="btn-settings" aria-label="設定" title="設定">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>

  <aside id="panel" hidden>
    <header>
      <h2>SETTINGS</h2>
      <button id="panel-close" aria-label="閉じる">×</button>
    </header>
    <label>テンポ BPM <output id="bpm-out"></output>
      <input id="bpm" type="range" min="80" max="140" step="1" value="108"></label>
    <label>検出の感度 <output id="sens-out"></output>
      <input id="sens" type="range" min="0.6" max="2.5" step="0.05" value="1.8"></label>
    <label>同時に鳴るループの上限 <output id="maxv-out"></output>
      <input id="maxv" type="range" min="1" max="8" step="1" value="6"></label>
    <label>音量 <output id="vol-out"></output>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="0.9"></label>
    <label class="check"><input id="follow" type="checkbox" checked> 枠をカメラの動きに合わせて追従</label>
    <label class="check"><input id="dbg" type="checkbox"> 解析セルと統計を表示</label>
    <div class="row">
      <button id="switch-mode">カメラ ⇄ デモ 切替</button>
    </div>
    <div class="row">
      <button class="refresh-app" type="button">最新版に更新（読み込み直す）</button>
      <p class="hint version-text">版：…</p>
    </div>
    <div class="demo-only">
      <p class="hint">デモ：ドラッグで移動、ホイール／ピンチで拡大縮小。6秒放置すると自動で巡回します。</p>
      <label class="file">画像を読み込んで試す<input id="file" type="file" accept="image/*"></label>
      <button id="save-poster">デモポスターを保存（PNG・印刷用）</button>
    </div>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
