# Tests on every push to main (or by hand: Actions → Pages → Run), and the
# old address on GitHub Pages (https://shibagaki16.github.io/ostinascope/):
# a page that sends visitors on to https://ostinascope.shibagaki16.jp/.
# The app itself is built and published by Cloudflare (wrangler.jsonc,
# docs/publish.md).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  site:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The page that sends visitors to the new address
        run: |
          mkdir -p _site
          cp .github/pages-moved/index.html .github/pages-moved/sw.js _site/
          cp .github/pages-moved/index.html _site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # a job of its own: in the same job, right after the upload, the artifact
  # is sometimes not listed yet ("No artifacts named github-pages"), and a
  # re-run then finds two. Re-running this job alone reuses the one upload.
  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
