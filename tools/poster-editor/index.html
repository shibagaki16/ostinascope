<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster Editor — Ostinascope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <strong>ポスター編集</strong>
    <span class="group">
      <button id="save" title="⌘S">保存</button>
      <span id="status"></span>
    </span>
    <span class="group">
      <button id="undo" title="⌘Z">↶ 戻す</button>
      <button id="redo" title="⇧⌘Z">↷ やり直す</button>
    </span>
    <span class="group">
      <label>表示 <select id="zoom">
        <option value="fit">全体</option><option value="0.25">25%</option>
        <option value="0.5">50%</option><option value="1">100%</option>
      </select></label>
      <label><input type="checkbox" id="ugrid"> u グリッド</label>
    </span>
    <span class="group">
      <label><input type="checkbox" id="scope"> カメラで見る</label>
      <label>画角 <input type="range" id="scope-size" min="200" max="1600" step="20" value="600"></label>
    </span>
    <span class="group right">
      <button id="export-png">PNG（印刷用 2×）</button>
      <button id="export-json">JSON 書き出し</button>
      <label class="button">JSON 読み込み <input type="file" id="import-json" accept=".json,application/json" hidden></label>
      <a href="../../?mode=demo" target="_blank" rel="noopener">アプリで確認 ↗</a>
    </span>
  </header>

  <aside id="layers">
    <div class="pane-title">要素（上ほど手前）</div>
    <ol id="layer-list"></ol>
    <div class="row">
      <select id="add-type"></select>
      <button id="add">追加</button>
    </div>
    <div class="row">
      <button id="up" title="手前へ">↑</button>
      <button id="down" title="奥へ">↓</button>
      <button id="dup" title="⌘D">複製</button>
      <button id="del" title="Delete">削除</button>
    </div>
    <p class="hint">
      クリックで選択、ドラッグで移動（連動する注記もついてくる。⌥ で単独、⇧ で u 単位）。
      矢印キーで 1px（⇧ で 10px）。
    </p>
  </aside>

  <main id="stage">
    <div id="canvas-wrap">
      <canvas id="poster"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </main>

  <aside id="props">
    <div class="pane-title" id="props-title">—</div>
    <form id="fields" autocomplete="off"></form>
    <div class="pane-title">配色</div>
    <div id="palette"></div>
    <div class="row"><button id="add-color">色を追加</button></div>
    <div class="pane-title">カメラで見る</div>
    <div id="scope-out" class="hint">「カメラで見る」をオンにすると、カーソルの位置をスマホの画面として検出します（クリックで固定）。1 フレームの判定で、アプリでは数フレーム続くと鳴ります。</div>
  </aside>

  <footer id="coords"></footer>
  <script type="module" src="editor.js"></script>
</body>
</html>
